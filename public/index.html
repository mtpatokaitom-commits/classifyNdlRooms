<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>レファレンス相談 - 専門室振り分け</title>
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<style>
  :root {
    color-scheme: light;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  body {
    margin: 0;
    background: #f5f5f3;
    color: #222;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 {
    font-size: 1.25rem;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 100px;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2c5f8a;
    color: #fff;
    cursor: pointer;
  }
  button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  button.secondary {
    background: #888;
  }
  .question-text {
    font-size: 1.05rem;
    margin-bottom: 12px;
  }
  .loading {
    text-align: center;
    color: #666;
    padding: 40px 0;
  }
  .history {
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: #555;
  }
  .history .turn {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #ddd;
  }
  .room-label {
    font-size: 1.3rem;
    font-weight: bold;
    color: #2c5f8a;
    margin-bottom: 16px;
  }
  .document {
    white-space: pre-wrap;
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 16px;
    line-height: 1.6;
  }
  .error {
    color: #b00020;
  }
</style>
</head>
<body>
<div id="app">
  <h1>国立国会図書館 レファレンス相談</h1>

  <div class="card" v-if="phase === 'intro'">
    <p class="question-text">お探しの資料や、お調べになりたい内容を入力してください。</p>
    <textarea v-model="initialQuestion" placeholder="例:明治期の東京の地形図を探しています"></textarea>
    <div>
      <button @click="start" :disabled="!initialQuestion.trim()">相談を始める</button>
    </div>
  </div>

  <div class="card" v-else-if="phase === 'asking'">
    <div class="history" v-if="turns.length">
      <div class="turn" v-for="(t, i) in turns" :key="i">
        <strong>Q:</strong> {{ t.question }}<br />
        <strong>A:</strong> {{ t.answer }}
      </div>
    </div>
    <p class="question-text">{{ currentQuestion }}</p>
    <textarea v-model="currentAnswer" placeholder="回答を入力してください"></textarea>
    <div>
      <button @click="submitAnswer" :disabled="!currentAnswer.trim()">回答する</button>
    </div>
  </div>

  <div class="card loading" v-else-if="phase === 'loading'">
    確認しています…
  </div>

  <div class="card" v-else-if="phase === 'result'">
    <div class="room-label">ご案内先: {{ roomLabel }}</div>
    <div class="document">{{ document }}</div>
    <div>
      <button class="secondary" @click="reset">別の相談を始める</button>
    </div>
  </div>

  <div class="card error" v-else-if="phase === 'error'">
    <p>{{ errorMessage }}</p>
    <button class="secondary" @click="reset">最初からやり直す</button>
  </div>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
  setup() {
    // phase: intro -> loading -> asking -> loading -> ... -> result / error
    const phase = ref("intro");
    const initialQuestion = ref("");
    const state = ref("");
    const askedIds = ref([]);
    const turns = ref([]); // 画面表示用の質問回答履歴
    const currentQuestion = ref("");
    const currentQuestionId = ref("");
    const currentAnswer = ref("");
    const roomLabel = ref("");
    const documentText = ref("");
    const errorMessage = ref("");

    async function postJson(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `${path} の呼び出しに失敗しました(status: ${res.status})`);
      }
      return data;
    }

    async function proceed() {
      phase.value = "loading";
      try {
        const data = await postJson("/systemone", {
          state: state.value,
          asked_questions: askedIds.value
        });

        if (data.sufficient) {
          const handover = await postJson("/handover", {
            state: state.value,
            final_room: data.final_room
          });
          roomLabel.value = handover.room_label;
          documentText.value = handover.document;
          phase.value = "result";
          return;
        }

        const next = data.answers && data.answers.next_question;
        if (!next || !next.choice || !next.text) {
          throw new Error("次の質問を取得できませんでした。");
        }
        currentQuestionId.value = next.choice;
        currentQuestion.value = next.text;
        currentAnswer.value = "";
        phase.value = "asking";
      } catch (err) {
        errorMessage.value = err.message || "不明なエラーが発生しました。";
        phase.value = "error";
      }
    }

    function start() {
      state.value = initialQuestion.value.trim();
      askedIds.value = [];
      turns.value = [];
      proceed();
    }

    function submitAnswer() {
      const answer = currentAnswer.value.trim();
      state.value += `\nQ: ${currentQuestion.value}\nA: ${answer}`;
      turns.value.push({ question: currentQuestion.value, answer });
      askedIds.value.push(currentQuestionId.value);
      proceed();
    }

    function reset() {
      phase.value = "intro";
      initialQuestion.value = "";
      state.value = "";
      askedIds.value = [];
      turns.value = [];
      roomLabel.value = "";
      documentText.value = "";
      errorMessage.value = "";
    }

    return {
      phase,
      initialQuestion,
      turns,
      currentQuestion,
      currentAnswer,
      roomLabel,
      document: documentText,
      errorMessage,
      start,
      submitAnswer,
      reset
    };
  }
}).mount("#app");
</script>
</body>
</html>
