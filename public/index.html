<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>国立国会図書館 レファレンス案内</title>
<!-- 明朝体フォント (Shippori Mincho) の読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg-main: #f4efe6;          /* 羊皮紙風の背景色 */
    --card-bg: #fcfbfa;          /* カード背景 */
    --primary: #1b2a3a;          /* 濃紺（書庫・アカデミック） */
    --accent: #a37e38;           /* アンティークゴールド */
    --accent-hover: #886526;
    --text-main: #2b2723;        /* 墨色 */
    --text-sub: #5c554e;
    --border-color: #d8cebe;
    --border-dark: #b5a48b;
    --serif-font: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", Georgia, serif;
    --sans-font: "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  body {
    margin: 0;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--sans-font);
    background-image: radial-gradient(#e5dcd0 1px, transparent 1px);
    background-size: 20px 20px;
  }

  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .header-container {
    text-align: center;
    margin-bottom: 32px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 16px;
  }

  h1 {
    font-family: var(--serif-font);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary);
    margin: 0 0 6px 0;
    letter-spacing: 0.08em;
  }

  .header-sub {
    font-size: 0.85rem;
    color: var(--text-sub);
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 12px rgba(27, 42, 58, 0.05);
    border-radius: 4px;
    padding: 28px 24px;
    position: relative;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border: 1px solid var(--border-color);
    pointer-events: none;
  }

  .question-text {
    font-family: var(--serif-font);
    font-size: 1.15rem;
    color: var(--primary);
    line-height: 1.6;
    margin-bottom: 16px;
    font-weight: 700;
  }

  .input-wrapper {
    position: relative;
    margin-bottom: 16px;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 110px;
    padding: 12px 40px 12px 12px;
    font-size: 0.98rem;
    color: var(--text-main);
    background: #fff;
    border: 1px solid var(--border-dark);
    border-radius: 2px;
    resize: vertical;
    font-family: var(--sans-font);
    line-height: 1.5;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(163, 126, 56, 0.2);
  }

  .voice-btn-inline {
    position: absolute;
    right: 8px;
    bottom: 12px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    padding: 4px 8px;
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .voice-btn-inline:hover {
    transform: scale(1.15);
  }

  .voice-btn-inline.listening {
    animation: pulse 1.2s infinite;
    color: #c0392b;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .audio-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .speech-btn {
    background: #f0e8dc;
    border: 1px solid var(--border-dark);
    color: var(--primary);
    padding: 4px 12px;
    font-size: 0.82rem;
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .speech-btn:hover {
    background: #e5dac8;
  }

  .btn-group {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 16px;
  }

  button.primary {
    background: var(--primary);
    color: #fff;
    border: 1px solid var(--primary);
    padding: 10px 24px;
    font-size: 0.95rem;
    font-family: var(--serif-font);
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }

  button.primary:hover:not(:disabled) {
    background: #2a3e54;
  }

  button.primary:disabled {
    background: #9ca6b0;
    border-color: #9ca6b0;
    cursor: not-allowed;
  }

  button.secondary {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border-dark);
    padding: 10px 20px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  button.secondary:hover {
    background: #eae2d5;
  }

  .history {
    margin-bottom: 24px;
    background: #f5f0e8;
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    font-size: 0.88rem;
  }

  .history .turn {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border-color);
  }

  .history .turn:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .candidate-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 20px 0;
  }

  .candidate-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .candidate-item:hover {
    border-color: var(--accent);
    background: #faf7f2;
  }

  .candidate-item.selected {
    border-color: var(--accent);
    background: #f7f2ea;
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .candidate-info {
    flex: 1;
  }

  .candidate-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .candidate-label {
    font-family: var(--serif-font);
    font-weight: 700;
    color: var(--primary);
    font-size: 1.05rem;
  }

  .badge-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .recommended-badge {
    font-size: 0.72rem;
    background: var(--accent);
    color: #fff;
    padding: 2px 6px;
    border-radius: 2px;
  }

  .candidate-confidence {
    font-size: 0.8rem;
    background: #eae2d5;
    color: var(--text-main);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: bold;
  }

  .candidate-desc {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-sub);
    line-height: 1.5;
  }

  .room-label-box {
    font-family: var(--serif-font);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
    border-bottom: 1px solid var(--accent);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  .document {
    white-space: pre-wrap;
    background: #fff;
    border: 1px solid var(--border-color);
    padding: 20px;
    line-height: 1.7;
    font-size: 0.92rem;
  }

  .loading {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 0;
    font-family: var(--serif-font);
  }

  .error {
    color: #8b0000;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header-container">
    <h1>国立国会図書館 東京本館</h1>
    <div class="header-sub">レファレンス相談・専門室自動案内カウンター</div>
  </div>

  <!-- 1. 初期相談入力 -->
  <div class="card" v-if="phase === 'intro'">
    <p class="question-text">お調べになりたいテーマや、探している資料についてご記入ください。</p>
    <div class="input-wrapper">
      <textarea 
        v-model="initialQuestion" 
        placeholder="例: 昭和期の特定地域の路線価や地価の推移について調べています"
        @keydown.ctrl.enter="start" 
        @keydown.cmd.enter="start"
      ></textarea>
      <button 
        class="voice-btn-inline" 
        :class="{ listening: isListening }" 
        @click="toggleVoiceInput('initial')"
        :title="isListening ? '音声認識を停止' : '音声で入力する'"
      >🎤</button>
    </div>
    <div class="btn-group">
      <button class="primary" @click="start" :disabled="!initialQuestion.trim()">相談を開始する</button>
    </div>
  </div>

  <!-- 2. 追加ヒアリング質問 -->
  <div class="card" v-else-if="phase === 'asking'">
    <div class="history" v-if="turns.length">
      <div class="turn" v-for="(t, i) in turns" :key="i">
        <strong>Q:</strong> {{ t.question }}<br />
        <strong>A:</strong> {{ t.answer }}
      </div>
    </div>
    
    <div class="audio-bar">
      <p class="question-text" style="margin: 0; flex: 1;">{{ currentQuestion }}</p>
      <button class="speech-btn" @click="speak(currentQuestion)">🔊 読み上げ</button>
    </div>

    <div class="input-wrapper">
      <textarea 
        v-model="currentAnswer" 
        placeholder="回答をご記入ください (Ctrl + Enter で送信)" 
        @keydown.ctrl.enter="submitAnswer" 
        @keydown.cmd.enter="submitAnswer"
      ></textarea>
      <button 
        class="voice-btn-inline" 
        :class="{ listening: isListening }" 
        @click="toggleVoiceInput('answer')"
        :title="isListening ? '音声認識を停止' : '音声で入力する'"
      >🎤</button>
    </div>
    <div class="btn-group">
      <button class="primary" @click="submitAnswer" :disabled="!currentAnswer.trim()">回答を送信する</button>
    </div>
  </div>

  <!-- 3. 通信中 -->
  <div class="card loading" v-else-if="phase === 'loading'">
    資料データベース及び案内基準を照合しております…
  </div>

  <!-- 4. 専門室選択画面 -->
  <div class="card" v-else-if="phase === 'select_room'">
    <div class="audio-bar">
      <p class="question-text" style="margin: 0; flex: 1;">ヒアリングが完了しました。ご案内先を選択してください。</p>
      <button class="speech-btn" @click="speak('ヒアリングが完了しました。最も適していると思われる案内先を選択してください。')">🔊 読み上げ</button>
    </div>

    <div class="candidate-list">
      <label 
        v-for="candidate in roomCandidates" 
        :key="candidate.id" 
        class="candidate-item"
        :class="{ selected: selectedRoomId === candidate.id }"
      >
        <input type="radio" name="room" :value="candidate.id" v-model="selectedRoomId" style="margin-top: 4px;" />
        <div class="candidate-info">
          <div class="candidate-header">
            <span class="candidate-label">{{ candidate.label }}</span>
            <div class="badge-group">
              <span class="recommended-badge" v-if="candidate.id === recommendedRoomId">推奨</span>
              <span class="candidate-confidence">適合度 {{ candidate.confidence }}%</span>
            </div>
          </div>
          <p class="candidate-desc">{{ candidate.description }}</p>
        </div>
      </label>
    </div>

    <div class="btn-group">
      <button class="primary" @click="confirmRoom" :disabled="!selectedRoomId">この窓口に決定する</button>
    </div>
  </div>

  <!-- 5. 確定結果・引継ぎ書表示 -->
  <div class="card" v-else-if="phase === 'result'">
    <div class="room-label-box">ご案内窓口: {{ roomLabel }}</div>
    <div class="audio-bar" style="justify-content: flex-end;">
      <button class="speech-btn" @click="speak(documentText)">🔊 引継ぎ事項を読み上げ</button>
    </div>
    <div class="document">{{ documentText }}</div>
    <div class="btn-group">
      <button class="secondary" @click="reset">新しい相談を開始する</button>
    </div>
  </div>

  <!-- 6. エラー表示 -->
  <div class="card error" v-else-if="phase === 'error'">
    <p>{{ errorMessage }}</p>
    <div class="btn-group">
      <button class="secondary" @click="reset">最初の画面へ戻る</button>
    </div>
  </div>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
  setup() {
    const phase = ref("intro");
    const initialQuestion = ref("");
    const state = ref("");
    const askedIds = ref([]);
    const turns = ref([]);
    const currentQuestion = ref("");
    const currentQuestionId = ref("");
    const currentAnswer = ref("");
    
    const roomCandidates = ref([]);
    const selectedRoomId = ref("");
    const recommendedRoomId = ref("");

    const roomLabel = ref("");
    const documentText = ref("");
    const errorMessage = ref("");

    const isListening = ref(false);
    let recognition = null;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = false;
      recognition.interimResults = false;
    }

    function toggleVoiceInput(targetField) {
      if (!recognition) {
        alert("お使いのブラウザは音声入力に対応していません。");
        return;
      }

      if (isListening.value) {
        recognition.stop();
        isListening.value = false;
        return;
      }

      isListening.value = true;
      recognition.start();

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (targetField === 'initial') {
          initialQuestion.value = (initialQuestion.value + ' ' + transcript).trim();
        } else if (targetField === 'answer') {
          currentAnswer.value = (currentAnswer.value + ' ' + transcript).trim();
        }
        isListening.value = false;
      };

      recognition.onerror = () => {
        isListening.value = false;
      };

      recognition.onend = () => {
        isListening.value = false;
      };
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) {
        alert("お使いのブラウザは音声読み上げに対応していません。");
        return;
      }
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.0;
      window.speechSynthesis.speak(uttr);
    }

    async function postJson(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `${path} の処理に失敗しました(status: ${res.status})`);
      }
      return data;
    }

    async function proceed() {
      window.speechSynthesis?.cancel();
      phase.value = "loading";
      try {
        const data = await postJson("/systemone", {
          state: state.value,
          asked_questions: askedIds.value
        });

        if (data.sufficient) {
          roomCandidates.value = data.room_candidates || [];
          recommendedRoomId.value = data.final_room || (roomCandidates.value[0] && roomCandidates.value[0].id) || "";
          selectedRoomId.value = recommendedRoomId.value;
          phase.value = "select_room";
          return;
        }

        const next = data.answers && data.answers.next_question;
        if (!next || !next.choice || !next.text) {
          throw new Error("次の質問を取得できませんでした。");
        }
        currentQuestionId.value = next.choice;
        currentQuestion.value = next.text;
        currentAnswer.value = "";
        phase.value = "asking";
      } catch (err) {
        errorMessage.value = err.message || "不明なエラーが発生しました。";
        phase.value = "error";
      }
    }

    async function confirmRoom() {
      if (!selectedRoomId.value) return;
      window.speechSynthesis?.cancel();
      phase.value = "loading";
      try {
        const handover = await postJson("/handover", {
          state: state.value,
          final_room: selectedRoomId.value
        });
        roomLabel.value = handover.room_label;
        documentText.value = handover.document;
        phase.value = "result";
      } catch (err) {
        errorMessage.value = err.message || "引継ぎ文書の生成に失敗しました。";
        phase.value = "error";
      }
    }

    function start() {
      if (!initialQuestion.value.trim()) return;
      state.value = initialQuestion.value.trim();
      askedIds.value = [];
      turns.value = [];
      proceed();
    }

    function submitAnswer() {
      if (!currentAnswer.value.trim()) return;
      const answer = currentAnswer.value.trim();
      state.value += `\nQ: ${currentQuestion.value}\nA: ${answer}`;
      turns.value.push({ question: currentQuestion.value, answer });
      askedIds.value.push(currentQuestionId.value);
      proceed();
    }

    function reset() {
      window.speechSynthesis?.cancel();
      phase.value = "intro";
      initialQuestion.value = "";
      state.value = "";
      askedIds.value = [];
      turns.value = [];
      roomCandidates.value = [];
      selectedRoomId.value = "";
      recommendedRoomId.value = "";
      roomLabel.value = "";
      documentText.value = "";
      errorMessage.value = "";
    }

    return {
      phase,
      initialQuestion,
      turns,
      currentQuestion,
      currentAnswer,
      roomCandidates,
      selectedRoomId,
      recommendedRoomId,
      roomLabel,
      documentText,
      errorMessage,
      isListening,
      toggleVoiceInput,
      speak,
      start,
      submitAnswer,
      confirmRoom,
      reset
    };
  }
}).mount("#app");
</script>
</body>
</html>
